name: rhel-network-operations-lab

services:
  server:
    build: .
    command: ["python", "-m", "opslab.scenarios", "--serve", "8080"]
    networks: [operations]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  client:
    build: .
    command: ["bash", "-lc", "curl --fail http://server:8080/health && getent hosts server && ss -tn"]
    depends_on:
      server:
        condition: service_healthy
    networks: [operations]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  operations:
    internal: true

